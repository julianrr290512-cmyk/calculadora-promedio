<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Académico Inteligente & OCR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Librería OCR Gratuita para lectura de imágenes -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body>

    <header class="app-header">
        <h1><i class="fas fa-graduation-cap"></i> Gestor Académico Profesional</h1>
    </header>

    <main class="container">
        
        <!-- Crear Asignatura -->
        <section class="card add-section">
            <input type="text" id="new-subject-name" placeholder="Nombre de la Asignatura (Ej: Matemáticas)">
            <button id="add-subject-btn" class="btn-primary"><i class="fas fa-plus"></i> Nueva Materia</button>
        </section>

        <!-- Escáner de Imágenes OCR -->
        <section class="card ocr-section">
            <h3><i class="fas fa-camera"></i> Escáner de Notas desde Imagen</h3>
            <p>Sube una foto o captura con tus notas para extraerlas automáticamente:</p>
            <div class="ocr-controls">
                <input type="file" id="ocr-image-input" accept="image/*">
                <button id="process-ocr-btn" class="btn-accent"><i class="fas fa-magic"></i> Leer Imagen</button>
            </div>
            <div id="ocr-status" class="ocr-status"></div>
            <div id="ocr-results" class="ocr-results"></div>
        </section>

        <!-- Contenedor de Materias -->
        <section id="subjects-container" class="subjects-grid"></section>

    </main>

    <script src="script.js"></script>
</body>
</html>
